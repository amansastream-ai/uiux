<!DOCTYPE html>
<html lang="fr" data-theme="light" data-density="confort">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b58" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="description" content="SunuÉcole — la plateforme tout-en-un de gestion scolaire conçue pour l'Afrique francophone : élèves, présences, notes, bulletins, facturation Mobile Money, portail parents. Fonctionne hors connexion et sur bas débit.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SunuÉcole">
<title>SunuÉcole — Gestion scolaire tout-en-un</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<!-- Préconnexion inutile : aucune ressource externe, tout est local (bas débit) -->
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/print.css" media="print">
<link rel="stylesheet" href="/assets/css/bridge.css">

<!-- Affiche un squelette immédiat, avant même le chargement des modules JS :
     aucun écran blanc, même sur une connexion 3G lente. -->
<style>
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#f6f8f7;z-index:9999;transition:opacity .25s}
  #boot.done{opacity:0;pointer-events:none}
  @media (prefers-color-scheme:dark){#boot{background:#0b1220}}
  .boot-mark{width:54px;height:54px;border-radius:15px;background:linear-gradient(140deg,#0e7c66,#12a184);display:grid;place-items:center;box-shadow:0 10px 30px rgba(14,124,102,.35);animation:pulse 1.6s ease-in-out infinite}
  .boot-mark svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .boot-name{font:600 17px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.02em;color:#0f2b25}
  .boot-bar{width:150px;height:3px;border-radius:99px;background:rgba(14,124,102,.16);overflow:hidden}
  .boot-bar i{display:block;height:100%;width:35%;border-radius:99px;background:#0e7c66;animation:slide 1.1s ease-in-out infinite}
  @media (prefers-color-scheme:dark){.boot-name{color:#e6f2ef}}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @media (prefers-reduced-motion:reduce){.boot-mark,.boot-bar i{animation:none}}
</style>
<script src="/assets/js/boot-prefs.js"></script>
</head>
<body>

<div id="boot" role="status" aria-live="polite" aria-label="Chargement de SunuÉcole">
  <div class="boot-mark">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 8.5 12 4l9 4.5-9 4.5-9-4.5Z"/><path d="M6.5 10.8V16c0 1.4 2.5 2.8 5.5 2.8s5.5-1.4 5.5-2.8v-5.2"/><path d="M21 8.7v5"/>
    </svg>
  </div>
  <div class="boot-name">SunuÉcole</div>
  <div class="boot-bar"><i></i></div>
</div>

<a class="skip-link" href="#main">Aller au contenu principal</a>

<!-- Zone d'alerte accessible (annonces pour lecteurs d'écran) -->
<div id="a11y-live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<div id="app" hidden></div>

<div id="toasts" class="toasts" role="region" aria-label="Notifications"></div>
<div id="modal-root"></div>
<div id="palette-root"></div>

<script type="module" src="/assets/js/app.js"></script>
<script src="/assets/js/pwa.js"></script>
</body>
</html>
