[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/rss"
  to = "/.netlify/functions/rss"
  status = 200
  force = true

[[redirects]]
  from = "/api/live"
  to = "/.netlify/functions/live"
  status = 200
  force = true
