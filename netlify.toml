# SunuÉcole — configuration de déploiement Netlify.
# L'application complète (API Express + front) tourne dans une fonction
# serverless ; le dossier publish ne sert que de point d'entrée statique
# de secours, toutes les routes étant proxyfiées vers la fonction.

[build]
  command = "npm install --no-audit --no-fund"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."server"]
  timeout = 30
  included_files = [
    "web/**",
    "server/src/db/schema.sql"
  ]

# Toute requête (pages, assets, API) est traitée par l'application Express.
# force = true : sans cela, un fichier statique du dossier publish (par ex.
# /index.html) prend le pas sur la réécriture et la fonction Express n'est
# jamais appelée pour la racine → page « Redirection vers SunuÉcole ».
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = true
